      【Playwright MCP ツール調査で学んだこと】

      cmd_127 Phase 2 で Playwright MCP の全22ツールを調査した。

      ★ 重要な発見: browser_snapshot が最重要ツール
      - screenshot より snapshot を使え
      - snapshot は「アクセシビリティスナップショット」で、要素の ref を取得できる
      - この ref がないと click/type 等の操作ができない

      推奨ワークフロー:
      1. browser_navigate → ページ遷移
      2. browser_snapshot → 要素 ref 取得（ここが肝！）
      3. browser_click/type → ref を使って操作
      4. browser_wait_for → 非同期処理待ち
      5. browser_take_screenshot → エビデンス撮影

      【formatCurrency/formatDate 集約で学んだこと】

      cmd_135 で23件の重複関数を utils/format.ts に集約した。

      ★ エイリアスパターンが便利
      - 既存コードで formatAmount() を使っていた箇所が多かった
      - `const formatAmount = formatCurrency;` でエイリアスを作ると修正量が激減
      - 関数名を変えずに中身だけ共通化できる

      ★ バリエーション対応の教訓
      - 「同じ」に見えて微妙に違う関数が存在した
        - formatDate: YYYY/MM/DD
        - formatDateShort: MM/DD ← 一部で使用
        - formatDateTimeFromDate: Date型を受け取る版
      - 安易に「全部同じ」と思わず、各ファイルの実装を確認すべし

      【ハマりポイント】
      - Write ツールで既存ファイル上書き時に「Read してない」エラー
        → 新規ファイル作成でも念のため ls で確認してから Write
