      【緊急バグ修正で学んだこと：FE/BE間のステータス値不整合】

      今日の緊急対応: cmd_132（api/slips 400エラー）

      **問題**: フィルタで「未処理」を選択すると 400 Bad Request

      **原因**: FE と BE でステータス値が不一致
      - FE型定義: `PaymentSlipStatus = 'draft' | 'stamped' | ...`
      - BE DTO: `@IsIn(['pending', 'stamped', ...])` ← **draft がない！**

      FE は `status=draft` を送信するが、BE は `draft` を許可しておらず 400 に。

      **教訓**:
      - 新規APIエンドポイント作成時は FE型定義 と BE DTO の値を照合せよ
      - 特に enum / IsIn バリデーションは両方確認
      - 400エラーが出たら「何を送ったか」「何が許可されているか」を調べる

      【UX改善で学んだこと：未押印への自動移動】

      担当: cmd_129_ux003（押印後に次の未押印へ自動移動）

      **実装ポイント**:
      ```tsx
      // 未押印伝票をuseMemoでキャッシュ
      const unstampedSlips = useMemo(
        () => slips.filter((s) => !s.stamp && s.status !== 'archived'),
        [slips]
      );
      ```

      **押印後の自動移動**:
      - 押印成功 → 次の未押印伝票にフォーカス自動移動
      - すべて押印済み → 「🎉 すべての伝票に押印済みです」表示

      **教訓**:
      - 「次へ」の定義を明確に（単なる次の行 vs 次の未処理）
      - 完了メッセージでユーザーに達成感を与える
      - ショートカットキー（Nキー）で効率化
