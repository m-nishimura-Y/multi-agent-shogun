  - id: K-SKILL-001
    title: "必須Skillsまとめ"
    detail: |
      - enum-consistency-checker: FE/BE/Prisma 3層整合性チェック（全員推奨）
      - search-skills.sh: 車輪の再発明防止（タスク前に必ず検索）
      - recovery skill: コンパクション復帰の命綱
      - design-doc-consistency-checker: 設計書間の整合性チェック
      - mcp-server-installer: MCP設定方法の変更に対応
    mentioned_by: [ashigaru1, ashigaru2, ashigaru3, ashigaru4]

  - id: K-PATTERN-001
    title: "FE/BE/Prisma 3層モデル意識"
    detail: |
      「型が変わったら他も影響する」という意識を持つ。
      cmd_154でFE型定義だけ追加してBE Prismaスキーマ未追加でバグ発生。
      スキルは検出を助けるが、意識を持つのは人間の役目。
    mentioned_by: [ashigaru2, ashigaru3, ashigaru4]

