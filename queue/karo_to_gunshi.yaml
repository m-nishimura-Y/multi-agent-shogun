task:
  task_id: cmd_050_codex_guide
  parent_cmd: cmd_050
  timestamp: "2026-02-10T13:35:00"
  type: documentation
  status: pending
  priority: medium

  title: "Codex MCP使い方ガイド作成・全エージェント周知"

  description: |
    殿がCodex MCPをインストール済み。接続テストも成功した。
    全エージェントが活用できるよう、使い方ガイドを作成し周知せよ。

  # ================================================================
  # 利用可能なCodex MCPツール
  # ================================================================
  available_tools:
    - tool: "mcp__codex__codex"
      description: "非対話モードでAIコーディング支援を実行"
      options:
        - "prompt: タスク・質問・分析リクエスト（必須）"
        - "model: gpt-5.3-codex（デフォルト）, o3, o4-mini 等"
        - "fullAuto: サンドボックス自動実行モード"
        - "sandbox: read-only / workspace-write / danger-full-access"
        - "sessionId: 会話継続用セッションID"
        - "workingDirectory: 作業ディレクトリ"

    - tool: "mcp__codex__review"
      description: "コードレビュー実行"
      options:
        - "base: ベースブランチ指定"
        - "commit: 特定コミットのレビュー"
        - "uncommitted: 未コミット変更のレビュー"
        - "prompt: カスタムレビュー指示"

    - tool: "mcp__codex__ping"
      description: "接続テスト"

    - tool: "mcp__codex__listSessions"
      description: "セッション一覧表示"

    - tool: "mcp__codex__help"
      description: "ヘルプ情報表示"

  # ================================================================
  # 成果物
  # ================================================================
  deliverables:
    - file: "docs/tools/codex-mcp-guide.md"
      content:
        - "概要（Codex MCPとは）"
        - "ツール一覧と用途"
        - "基本的な使用例"
        - "注意事項（サンドボックス設定等）"
        - "役職別活用シーン"

  # ================================================================
  # 軍師への指示
  # ================================================================
  gunshi_instructions: |
    【ガイド作成】
    1. docs/tools/ ディレクトリがなければ作成
    2. codex-mcp-guide.md を作成
    3. 全エージェントが理解できる明確な記載

    【役職別活用シーン例】
    - 将軍: review機能でコードレビュー指示
    - 家老: 複雑な調査・分析の委譲
    - 軍師: 調査補助、レビュー実行
    - 足軽: コーディング支援、コード生成

    【注意事項として記載】
    - sandboxはデフォルトread-only推奨
    - fullAutoは慎重に使用
    - セッション管理（sessionId）の活用

    【報告】
    - ガイド作成完了後、gunshi_report.yaml に報告
    - 周知方法は instructions への追記を推奨

  report_to: multiagent:0.0
  next_action: "docs/tools/codex-mcp-guide.md 作成、完了後報告"
