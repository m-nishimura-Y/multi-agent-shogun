# ============================================================
# フロントエンド知見
# ============================================================
fe:
  - id: K-FE-001
    title: "MUI v7: item属性 → size属性に変更"
    detail: |
      Grid2 コンポーネントで item 属性は廃止された。
      代わりに size={{ xs: 12, md: 6 }} を使え。
      ビルドは通るが警告が出る。
    discovered_by: ashigaru8
    date: "2026-02-20"
    context: "cmd_104 Phase 4-C"

  - id: K-FE-002
    title: "re-export問題: export { Type } from だけでは同一ファイル内で使えない"
    detail: |
      export { Type } from './file' だけでは、同一ファイル内で Type を参照できない。
      解決方法: import type で取り込み → export type で再公開

      ❌ NG:
      export { SlipStatus } from './slip';
      const x: SlipStatus = ...;  // エラー

      ✅ OK:
      import type { SlipStatus } from './slip';
      export type { SlipStatus };
      const x: SlipStatus = ...;  // OK
    discovered_by: ashigaru1
    date: "2026-02-20"
    context: "cmd_104 Phase 4-C P4C-fix"

  - id: K-FE-003
    title: "API_BASE_URL 統一: 共通 apiClient を使え"
    detail: |
      各 hooks で独自に apiClient を定義すると API_BASE_URL 漏れが発生する。
      共通の apiClient (src/api/client.ts) を使用せよ。
      fetch() 直接呼び出しも禁止。
    discovered_by: ashigaru2
    date: "2026-02-20"
    context: "cmd_111 hooks層リファクタリング"

  - id: K-FE-004
    title: "MUI DataGrid v7: GridRowSelectionModel 構造変更"
    detail: |
      v7 では GridRowSelectionModel が配列ではなく
      { type: 'include' | 'exclude', ids: Set } オブジェクトに変更。
      checkboxSelection 使用時は型注意。
      シンプルな選択なら行クリックで id を state 管理する方が楽。

      ❌ NG:
      const [selected, setSelected] = useState<string[]>([]);

      ✅ OK:
      const [selectedId, setSelectedId] = useState<string | null>(null);
      onRowClick={(params) => setSelectedId(params.id as string)}
    discovered_by: ashigaru1
    date: "2026-02-26"
    context: "cmd_115 Phase 6 P6-1"

  - id: K-FE-005
    title: "MUI Table: Box component='tr' + TableRow の組み合わせ禁止"
    detail: |
      MUI Table で <tr> の中に <tr> がネストされるHTMLエラーが発生する。
      原因: Box component="tr" と TableRow を同時に使うと、
      両方が <tr> をレンダリングしてネストが発生。

      ❌ NG（HTMLエラー: <tr> inside <tr>）:
      <Box component="tr">
        <TableRow>...</TableRow>  // これも <tr> をレンダリング
      </Box>

      ✅ OK（どちらか一方を使う）:
      // パターン1: TableRow のみ
      <TableRow>
        <TableCell>...</TableCell>
      </TableRow>

      // パターン2: Box のみ（スタイル制御が必要な場合）
      <Box component="tr">
        <Box component="td">...</Box>
      </Box>

      ※ SlipRow.tsx 等でラッパー追加時に発生しやすい。
    discovered_by: karo
    date: "2026-02-27"
    context: "cmd_116 コードレビュー"

  - id: K-FE-006
    title: "React format関数: utils/format.ts に集約せよ"
    detail: |
      formatCurrency/formatDate が各コンポーネントに散在すると保守性が低下。
      utils/format.ts に集約し、エイリアスパターンで既存呼び出しを維持。

      ❌ NG（重複定義）:
      // SlipInfo.tsx
      const formatCurrency = (n: number) => `¥${n.toLocaleString()}`;
      // SlipRow.tsx
      const formatCurrency = (n: number) => `¥${n.toLocaleString()}`;

      ✅ OK（集約）:
      // utils/format.ts
      export const formatCurrency = (amount: number): string =>
        `¥${amount.toLocaleString('ja-JP')}`;

      // 各コンポーネント
      import { formatCurrency } from '@/utils/format';
      // または既存呼び出し維持: const formatAmount = formatCurrency;

      効果: 仕様変更（例: ¥→円表記）が1箇所で済む
    discovered_by: ashigaru5
    date: "2026-02-27"
    context: "cmd_135 formatCurrency/formatDate 集約"

  - id: K-FE-007
    title: "Vite初期テンプレート: CSS制限を最初に解除せよ"
    detail: |
      Vite初期テンプレートには画面横幅を制限するCSSが3箇所ある。
      業務アプリ開発時は最初にこれらを確認・修正すべし。

      確認すべき箇所:
      1. App.css: `#root { max-width: 1280px }` → 削除
      2. index.css: `body { display: flex; place-items: center }` → 削除
      3. Container: `maxWidth="xl"` → 適宜調整

      ✅ 新規プロジェクト参画時のチェックリスト:
      - [ ] App.css の max-width 確認
      - [ ] index.css の display/place-items 確認
      - [ ] Container の maxWidth 確認

      ※ 「1つ直して終わり」ではなく、本当に直ったかブラウザで確認せよ。
    discovered_by: ashigaru1
    date: "2026-02-27"
    context: "足軽雑談会 session_004"

  - id: K-FE-008
    title: "印鑑風デザイン: CSS で日本の印鑑らしさを出す"
    detail: |
      日本の印鑑らしさを CSS で表現するポイント:

      1. **丸形 + 明朝体**:
         border-radius: 50%;
         font-family: "Noto Serif JP", serif;

      2. **縦書き風**: flexbox で flex-direction: column + 文字ごとに <span>

      3. **手押し感**: transform: rotate(-5deg) で少し傾ける

      4. **かすれ効果**: filter: blur(0.3px) + radial-gradient で印影のムラ

      5. **深みのある朱色**: #C62828（ピンク系ではなく本物の朱肉に近い色）

      文字数による表示分岐:
      - 2文字（振込）→ 縦書き
      - 3文字（未払金）→ 縦書き小さめ
      - 4文字以上（口座振替）→ 2行表示
    discovered_by: ashigaru2
    date: "2026-02-27"
    context: "足軽雑談会 session_004"

  - id: K-FE-009
    title: "FE/BE レスポンス乖離: 型名の不一致に注意"
    detail: |
      BE が返すフィールド名と FE が期待するフィールド名が異なる場合がある。

      例:
      - BE: { paymentType: 'transfer' }
      - FE: { stamp: { type: 'transfer' } }

      対策:
      1. API レイヤーでレスポンス変換を追加
         if (item.paymentType && !item.stamp) {
           return { ...item, stamp: { type: item.paymentType, ... } };
         }
      2. 両方の名前をサポートする
         const value = response.stampType ?? response.stampTypeId;
      3. TypeScript の型定義を BE の実際のレスポンスに合わせて更新

      根本解決は BE/FE 間の型定義を共有すること（OpenAPI等）。
      既存スキル fe-be-response-mapper も活用せよ。
    discovered_by: ashigaru1
    date: "2026-03-02"
    context: "cmd_143 判子種類表示修正"

  - id: K-FE-010
    title: "CSS: border-width 変更によるレイアウト崩れ"
    detail: |
      ボーダー幅を動的に変更するとコンテンツ領域が変わり、
      テキストの折り返しが変わってレイアウトが崩れることがある。

      ❌ NG例:
      border: 2px → border-width: 3px（selected時）
      // 1pxの差でコンテンツ領域が狭くなり、テキストが折り返される

      ✅ OK例:
      // パターン1: border-width は固定、border-color で状態表現
      .card { border: 2px solid transparent; }
      .card--selected { border-color: var(--primary); }

      // パターン2: box-shadow で選択状態を表現（box モデルに影響しない）
      .card--selected { box-shadow: 0 0 0 2px var(--primary); }

      // パターン3: outline で選択状態を表現（box モデルに影響しない）
      .card--selected { outline: 2px solid var(--primary); }

      ポイント: border-width 変更は box モデルに影響する。
      選択状態等は border-color/box-shadow/outline で表現すべし。
    discovered_by: ashigaru1
    date: "2026-03-02"
    context: "cmd_143 ファイルケースクリック動作修正"

  - id: K-FE-012
    title: "FE: fetch 直接使用禁止、apiClient を使え"
    detail: |
      S-automation では apiClient が baseURL `/s-automation/api` を設定している。
      fetch('/api/...') を直接使うと baseURL が適用されず 404 になる。

      ❌ NG:
      fetch('/api/slips/${id}')
      // 実際のURL: /api/slips/xxx → 404

      ✅ OK:
      apiClient.get('/slips/${id}')
      // 実際のURL: /s-automation/api/slips/xxx → 正常

      【チェック方法】
      プロジェクト内で fetch( を検索し、apiClient に統一されているか確認。
      Grep pattern: "fetch\\s*\\("

      ※ cmd_111 で hooks 層リファクタリングしたが、漏れがあり得る。
    discovered_by: ashigaru2
    date: "2026-03-02"
    context: "cmd_158 ISSUE-2 伝票詳細404エラー修正"

  - id: K-FE-011
    title: "React Router: useParams パラメータ名の一致が必須"
    detail: |
      ルート定義の :paramName と useParams で取得する変数名は一致が必要。
      不一致だと undefined になる。

      ❌ NG例:
      // ルート定義
      <Route path="/slips/:slipId" element={<SlipDetail />} />
      // コンポーネント
      const { id } = useParams();  // undefined! :slipId と :id が不一致

      ✅ OK例:
      // ルート定義
      <Route path="/slips/:slipId" element={<SlipDetail />} />
      // コンポーネント
      const { slipId } = useParams();  // OK! 一致している

      ポイント: パラメータ名変更時は、ルート定義とuseParams両方を確認せよ。
    discovered_by: ashigaru1
    date: "2026-03-02"
    context: "cmd_148 設計書レビュー"

  - id: K-BE-004
    title: "NestJS API疎通テストで404が出たらクリーンビルド"
    detail: |
      新規エンドポイント追加後に404が出る場合、dist内に古いビルドが残っている可能性。
      クリーンビルドで解決できる。

      ✅ 解決手順:
      1. rm -rf dist/
      2. npm run build
      3. サーバー再起動

      ※ 新規Controller追加時・ルーティング変更時に発生しやすい。
    discovered_by: ashigaru7
    date: "2026-02-26"
    context: "cmd_115 Phase 6 P6-7 統合テスト"

  - id: K-BE-005
    title: "Prisma 7 Docker: 型エラー発生時の対処"
    detail: |
      Docker内で npm run start:dev（ts-node）実行時に
      「Module '@prisma/client' has no exported member」エラーが出る場合、
      コンテナ内で Prisma クライアント再生成が必要。

      ✅ 解決手順:
      docker exec <container> npx prisma generate

      ※ ローカルビルド成功でもコンテナ内では別途生成必須。
    discovered_by: ashigaru1
    date: "2026-02-27"
    context: "cmd_117 バックエンド再ビルド・Docker再起動"

# ============================================================
# バックエンド知見
