  - id: cmd_055
    timestamp: "2026-02-16T17:00:00"
    command: "【周知】コンパクション復帰自動通知機能の全軍展開"
    project: multi-agent-shogun
    priority: high
    status: pending
    details:
      summary: |
        殿と将軍で開発・検証した「コンパクション復帰自動通知機能」を全軍に周知せよ。
        これにより、コンパクション後のエージェントが自動で復帰報告を促される。

      background: |
        【問題】
        - コンパクション後、エージェントが復帰報告を忘れることがあった
        - SessionStart hook の "compact" matcher は stdout を Claude に注入しない（GitHub issue #15174）

        【解決策】
        - recovery.sh を改良し、自分自身の tmux pane に通知を送る仕組みを実装
        - 8秒後に「【コンパクション復帰】殿に報告せよ。」というメッセージが届く
        - エージェントはこのメッセージを受け取り、殿への復帰報告を行う

      technical_details:
        hook_config: "~/.claude/settings.json に SessionStart hook 設定済み"
        matcher: "compact"
        script: "bin/recovery.sh"
        mechanism: |
          1. コンパクション完了時に SessionStart hook が発動
          2. recovery.sh が実行され、pane名と現在タスクを表示
          3. 8秒後にバックグラウンドプロセスが自分自身に通知を送信
          4. エージェントが通知を受け取り、復帰報告を行う

      verified:
        - agent: "shogun"
          pane: "shogun:0.0"
          result: "成功"
          log: "/tmp/recovery_debug.log に記録済み"

      action_required:
        - "dashboard.md に新機能を記載せよ"
        - "全エージェント（軍師、本隊、別働隊）に周知せよ"
        - "次回コンパクション時に各自動作確認するよう伝えよ"

      note: |
        デバッグログ（/tmp/recovery_debug.log）は当面残す。
        各ペインで正常動作が確認できたら、将軍に報告せよ。

