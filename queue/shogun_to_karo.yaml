  # ============================================================
  # cmd_159: ステータス表示の日本語化・整理
  # ============================================================
  - id: cmd_159
    timestamp: "2026-03-02T17:04:27"
    command: "伝票ステータス表示を日本語化し、表示ロジックを整理せよ"
    project: S-automation
    priority: high
    status: pending
    details:
      background: |
        殿より指摘：
        1. 振込済みデータにも「要確認」ラベルがついている
        2. ステータスは英語ではなく日本語で表示すべき
        3. isConfirmed ではなく、伝票ステータス自体で表示を切り替える
        4. ステータスは「今の状態」ではなく「次に何をすべきか」を示す

      changes:
        - target: "FE ステータス表示"
          description: |
            伝票ステータスを日本語表示に変更：

            | ステータス | 日本語表示 |
            |-----------|-----------|
            | pending | 登録済み |
            | stamped | Wチェック待ち |
            | cased | 仕訳待ち |
            | journalized | 振込待ち |
            | transferred | 完了 |
            | archived | キャビネット保管済み |

            ※判子が押されたことは一覧で判子アイコン表示されるので、
              ステータスは「次のアクション」を示す方が直感的

        - target: "isConfirmed ラベル削除"
          description: |
            「要確認」「確認済」ラベルは廃止。
            ステータス自体で状態を表現する。

            ※transferredやarchivedに「要確認」が表示されるバグも解消

        - target: "シードデータ確認"
          description: |
            既存シードデータのステータス整合性を確認。
            完了状態のデータは transferred または archived に統一。

      note: |
        設計書（12_ワークフロー詳細.md）のステータス定義に準拠。
        「アーカイブ済み」→「キャビネット保管済み」は殿のご意向。
        紙運用の体感を電子化するコンセプトに合致。

