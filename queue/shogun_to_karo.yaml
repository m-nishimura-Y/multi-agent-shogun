  - id: cmd_112
    timestamp: "2026-02-20T18:58:54"
    command: "【組織改善】横のつながり強化制度を導入せよ"
    project: multi-agent-shogun
    priority: medium
    status: pending
    details:
      summary: |
        殿と将軍の雑談実験で、足軽間の本音トークが有効であることが実証された。
        「reflectionは独り言、雑談は対話。質が違う」という名言も生まれた。
        これを正式な制度として導入する。

      background: |
        【雑談実験の成果】
        - 本隊（1号×2号）: 「知ってれば一瞬」系の知識共有不足を発見
        - 別働隊（5号×7号）: 「俺のせいじゃない」問題、設計書抜粋希望を発見
        - 6号伝説: 将軍の特例許可すらガン無視（規律の鬼）

        【発見された課題】
        - 縦の指揮系統は効率的だが、横の知識共有が弱い
        - 同じ苦労を経験しても共有されない
        - reflection は任意だが「毎回書かなきゃ」と誤解されている

      implementation:
        item_1:
          name: "reflection 任意の再周知"
          target_files:
            - "instructions/ashigaru/報告書.md"
          action: "「任意」であることを明確に再周知"

        item_2:
          name: "定期雑談会の制度化"
          frequency: "1日の終わり"
          format:
            - "本隊（1-4号）同士で雑談"
            - "別働隊（5-8号）同士で雑談"
            - "3往復で区切る"
            - "話しかけた側が記録・将軍に報告"
          topics:
            - "今日印象に残ったこと"
            - "困ったこと・ハマったこと"
            - "改善提案"
          note: "家老・軍師には概要のみ共有（本音を引き出すため）"

        item_3:
          name: "今日の雑談結果をObsidianに登録"
          content:
            - "本隊雑談記録（1号×2号）"
            - "別働隊雑談記録（5号×7号）"
            - "6号伝説（規律の鬼）"
            - "足軽から出た改善提案一覧"

      experiment_records:
        hontai:
          file: "queue/reports/shogun_direct_ashigaru1_chat.yaml"
          highlight: "「reflectionは独り言、雑談は対話。質が違う」"
        bettudoutai:
          file: "queue/reports/shogun_direct_ashigaru5_chat.yaml"
          highlight: "skill_candidate:found:false 毎回無駄、9割falseなんだから"
        ashigaru6_legend:
          description: "将軍の特例許可すらガン無視、タスクファイルが全て"

      action_required:
        - "instructions/ashigaru/報告書.md に reflection 任意を明記"
        - "定期雑談会のルールを instructions に追記"
        - "今日の雑談結果を Obsidian に登録"
        - "dashboard.md に周知"

