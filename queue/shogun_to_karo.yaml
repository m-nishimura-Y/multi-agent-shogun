  # ============================================================
  # consultation_001: 意見募集（解決済み）
  # ============================================================
  - id: consultation_001
    timestamp: "2026-02-20T13:42:13"
    type: consultation
    from: shogun
    command: "【意見募集】S-automation 実装計画の見直しについて"
    status: resolved
    resolution: "殿の決定: 案B（FE hooks層のみ再構築）を採用。cmd_111 で計画書作成へ。"
    project: S-automation
    priority: high
    status: pending

    background: |
      Phase 1-4 の実装を進めてきたが、以下の問題が繰り返し発生している:

      1. API_BASE_URL の不統一（useArchive, useReports, useFileCases 等）
      2. FE/BE の API 乖離（cmd_099 で18件検出）
      3. ビルドは通るが動かない状態の頻発
      4. バグを潰しても別の箇所で同じパターンが出る

      根本原因: 設計書→実装の間の「実装計画」が不十分だった。

    question: |
      殿より、家老の意見を求められている:

      「実装計画を立て直した方がいいか？」
      「FE だけ作り直すという選択肢もあるが、どう思うか？」

    options:
      - id: A
        description: "現状維持でバグ潰しを続ける"
        pros: "追加コストなし"
        cons: "モグラ叩き状態が続く可能性"

      - id: B
        description: "FE の hooks 層だけ作り直す"
        pros: "問題の多い部分に集中、BE は活かせる"
        cons: "部分的な作り直しは整合性リスク"

      - id: C
        description: "FE 全体を作り直す"
        pros: "綺麗な土台、統一された構造"
        cons: "コスト大（約3,000行相当）"

      - id: D
        description: "FE + BE 両方作り直す"
        pros: "完全にクリーンな状態"
        cons: "コスト最大（約6,000行相当）"

    shogun_opinion: |
      将軍としては「B: FE の hooks 層だけ作り直す」を推奨。
      BE は比較的マシ。FE の構造問題（共通 apiClient 未使用等）が大きい。

      ただし、作り直すなら「実装計画書」を先に作るべき:
      1. 共通 apiClient の設計
      2. FE/BE の型共有方式
      3. 各画面の実装順序と依存関係
      4. テスト方針（API 疎通確認必須化）

    expected_output: |
      - 推奨案（A/B/C/D のいずれか）
      - 理由（現場を見てきた家老の視点で）
      - 作り直す場合の実装計画は必要か？
      - その他の懸念・提案

