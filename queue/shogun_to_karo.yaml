  - id: cmd_050
    timestamp: "2026-02-16T14:50:00"
    command: "【検証】self-compact.sh の動作テスト"
    project: multi-agent-shogun
    priority: high
    status: done
    details:
      summary: |
        殿と将軍で議論した結果、コンパクション自己管理の新しい仕組みを検証する。

      background: |
        【問題の経緯】
        1. 家老のコンテキストが9%まで減っていたが、自動compactが走らなかった
        2. 調査の結果、auto-compactは「残り5%（95%使用時）」で発動することが判明
        3. 「Context left until auto-compact: 9%」は「使用率91%、あと4%で発動」の意味だった

        【殿の懸念】
        - 作業途中でcompactしたくない
        - エージェントの注意力に頼りたくない
        - /compact は足軽・家老が直接実行できない（殿が確認済み）

        【解決案】
        - bin/self-compact.sh を作成
        - 各エージェントがタスク完了時に残量15%以下なら自分で実行
        - 「注意力」ではなく「手順」として自己管理

      test_request: |
        足軽1名に以下を試させよ：
        1. ~/multi-agent-shogun/bin/self-compact.sh を実行
        2. /compact が自分のpaneで実行されるか確認
        3. 結果を報告

      script_location: "bin/self-compact.sh"

      expected_behavior: |
        スクリプトが自分のpaneに /compact を送り、コンパクションが実行される

      if_success: |
        全エージェントの役割ファイルに「タスク完了時、残量15%以下なら bin/self-compact.sh 実行」を追加

      if_failure: |
        別の方法を検討（cron、殿への報告など）

