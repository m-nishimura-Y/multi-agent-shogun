    timestamp: "2026-02-20T11:29:23"
    command: "【組織改善】報告書に reflection フィールド追加"
    project: multi-agent-shogun
    priority: medium
    status: pending
    details:
      summary: |
        殿と軍師の雑談から生まれた改善案。
        足軽の報告書に「振り返り」フィールドを追加し、気づきを集約する仕組みを作る。

      background: |
        軍師との雑談で判明した課題：
        - 業務フローでは「外向き処理」ばかりで「内向き処理（自己参照）」が発生しない
        - 「困っていること」「気になること」を言語化する機会がない
        - 問われて初めて意識が向き、解像度が上がる

        例：軍師は「Step 3.5を読み飛ばした」と思っていたが、
        雑談で「読む必要性を軽視していた」という根本原因に気づいた。

        雑談は「効率」ではなく「メンテナンス」。
        機械も油を差さねば錆びる。AIも同様かもしれぬ。

      implementation:
        target_file: "instructions/ashigaru/報告書.md"

        new_field:
          name: "reflection"
          required: false  # 任意
          description: "今回の作業で気づいたこと、気になったこと、改善提案など"

        example: |
          reflection:
            insight: "APIの設計書と実装の乖離が多い。設計書レビュースキルを先に使うべきだった"
            concern: "同じパターンのコードを3回書いた。スキル化候補かも"
            suggestion: "ビルド確認は足軽7-8専任ではなく、最後に担当した人がやる方が効率的では"

      aggregation:
        - "軍師が別働隊の reflection を集約"
        - "家老が本隊の reflection を集約"
        - "週次または月次で殿に「今週の気づき」として報告"

      purpose: |
        形骸化を防ぐため、この経緯を報告書マニュアルに明記せよ。
        「なぜこのフィールドがあるのか」を理解していれば、意味のある振り返りができる。

      action_required:
        - "instructions/ashigaru/報告書.md に reflection フィールドを追加"
        - "背景・目的・使い方を明記（形骸化防止）"
        - "軍師・家老の指示書にも集約方法を追記"
        - "dashboard.md に周知事項として追加"

