  - id: cmd_048
    timestamp: "2026-02-16T14:20:00"
    command: "【機能追加】Obsidian自動登録機能の実装"
    project: multi-agent-shogun
    priority: high
    status: done
    started_at: "2026-02-16T14:22:00"
    completed_at: "2026-02-16T14:25:00"
    details:
      summary: |
        殿より指示。cmd完了時にObsidian登録を自動化する仕組みを導入せよ。
        重要度判定付きで、価値あるものだけ登録する。

      design:
        trigger: "cmd完了時の報告"

        report_format_addition: |
          # gunshi_summary.yaml に以下を追加
          obsidian_worthy: true/false
          obsidian_category: "知見/失敗と学び" or "知見/成功事例" or "案件/xxx" 等
          obsidian_title: "ノートのタイトル"
          obsidian_summary: "ノートの概要（frontmatter用）"

        registration_criteria:
          should_register:
            - "失敗と学び（再発防止）"
            - "成功事例（横展開可能）"
            - "未来設計・アイデア"
            - "重要な意思決定の経緯"
            - "新しいスキル作成"
          should_not_register:
            - "単純な整理タスク（dashboard更新など）"
            - "ルーティン作業"
            - "既存Issueへのコメント追記のみ"

        workflow: |
          1. 軍師がcmd完了時に obsidian_worthy を判定
          2. true の場合、obsidian_category と obsidian_title を設定
          3. 家老がサマリ受領時、obsidian_worthy: true なら Obsidian MCP で登録
          4. dashboard.md に「📚 Obsidian登録済み」を付記

      action_required:
        - "軍師の報告フォーマット（gunshi_summary.yaml テンプレート）を更新"
        - "家老の受領ワークフロー（karo.md または karo/報告受領.md）を更新"
        - "軍師・家老に新フローを周知"

