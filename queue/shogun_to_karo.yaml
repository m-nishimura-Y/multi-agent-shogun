  # ============================================================
  - id: cmd_129
    timestamp: "2026-02-27T15:44:46"
    command: "伝票押印画面の抜本的UI改善（殿の直接フィードバック第2弾）"
    project: S-automation
    priority: high
    status: pending
    details:
      summary: |
        伝票一覧画面の本来の目的は「押印作業を効率的に行う画面」である。
        現状はステータス確認画面のようになっており、本来の目的と乖離している。

      core_concept: |
        【この画面の目的】
        未押印の伝票を次々に表示し、キーボードで効率よく押印していく作業画面。

        【ユーザーの作業フロー】
        1. 未押印伝票を選択（または自動で次の未押印を表示）
        2. 右側プレビューで内容確認
        3. キーボード（F/G/H等）で押印
        4. 次の未押印伝票へ自動移動
        5. 繰り返し

      issues:
        - id: UX-001
          priority: HIGH
          title: "ステータス表示が押印状況と混同する"
          current: "ステータスに色付きバッジを使用、押印状況と紛らわしい"
          expected: |
            ステータスは控えめに表現（グレー文字、小さいテキスト等）
            押印状況こそが主役

        - id: UX-002
          priority: HIGH
          title: "判子が小さくて分かりづらい"
          current: "四角の中に「F」だけ表示"
          expected: |
            判子を大きく表示（実際の印鑑のような見た目）
            「振込」「口座振替」等の文字が読める
            押印済みは赤い印影、未押印はグレーアウト

        - id: UX-003
          priority: HIGH
          title: "未押印伝票への移動動線がない"
          current: "手動で一覧から選択するしかない"
          expected: |
            「次の未押印へ」ボタンまたはショートカット（N/Tab等）
            押印完了後、自動で次の未押印伝票を表示
            未押印が0件になったら完了メッセージ

        - id: UX-004
          priority: HIGH
          title: "右側プレビューで押印状態が見えない"
          current: "PDF表示のみ？"
          expected: |
            プレビューエリアに大きな判子アイコンを表示
            押印済みの判子は赤い印影で「押されている」感
            未押印の判子はグレーで「ここに押す」感

      design_reference: |
        【判子のビジュアルイメージ】
        - 丸または四角の印鑑風デザイン
        - 押印済み: 赤い印影（少し傾いている、かすれ効果あり）
        - 未押印: グレーの枠線のみ、クリック/キーで押印可能

        【一覧側の表示】
        - 左: 伝票番号、金額、取引先（必要最小限）
        - 右: 押印アイコン群（振込○、口座振替×、承認○ 等）
        - ステータスは行末に小さく

      action_required:
        - "cmd_128 と統合して対応可"
        - "UI/UXデザインを先に検討してから実装"
        - "本隊FEに割り当て"

