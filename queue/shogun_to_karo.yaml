    details:
      summary: |
        殿より報告: /file-cases 画面で黒画面になるバグ。
        useFileCases.ts:85 で TypeError: Cannot convert undefined or null to object at Object.values

      root_cause: |
        フロントエンドとバックエンドの /file-cases API のレスポンス形式が乖離している。

        【フロントエンドが期待する形式】
        {
          "success": true,
          "data": {
            "cases": [...],
            "counts": { "pending_approval": 12, ... }
          }
        }

        【バックエンドの実際のレスポンス】
        {
          "success": true,
          "data": {
            "phases": [...],
            "totalCount": 8,
            "totalSlips": 0
          }
        }

        フロントエンドの useFileCases.ts:57 で setCounts(response.data.counts) を呼んでいるが、
        response.data.counts は undefined なので counts が undefined になり、
        85行目の Object.values(counts) でエラーが発生。

      files_to_fix:
        option_a:
          description: "フロントエンドをバックエンドに合わせる（推奨）"
          files:
            - "frontend/src/hooks/useFileCases.ts"
            - "frontend/src/types/file-case.ts (FileCasesResponse 型)"
          changes: |
            1. FileCasesResponse 型を実際のレスポンス形式に修正
            2. useFileCases.ts で phases からデータを取得するよう修正
            3. counts は各 fileCase の slipCount から算出

        option_b:
          description: "バックエンドをフロントエンドに合わせる"
          files:
            - "backend/src/modules/file-cases/file-cases.service.ts"
            - "backend/src/modules/file-cases/dto/file-case.dto.ts"
          note: "バックエンドを変更すると既存の正常な動作に影響する可能性あり"

      recommended: "option_a（フロントエンドを修正）"
      reason: "バックエンドのレスポンスは既に構造化されており、有用。フロントエンドを合わせるのが低リスク"

      action_required:
        - "frontend/src/hooks/useFileCases.ts を修正"
        - "frontend/src/types/file-case.ts の FileCasesResponse 型を実際に合わせる"
        - "ビルド確認後、ブラウザで /file-cases 画面が正常に表示されることを確認"
        - "dashboard.md に報告"

      additional_bug_20261220_1211:
        timestamp: "2026-02-20T12:11:13"
        issue: "useArchive.ts の API_BASE_URL 未使用問題（404エラー）"
        symptoms:
          - "GET https://192.168.3.44/api/cabinets/years 404"
          - "GET https://192.168.3.44/api/cabinets/summary 404"
        root_cause: |
          useArchive.ts（68-83行目）に独自の apiClient が定義されており、
          API_BASE_URL を使わずに /api/... を直接呼んでいる。

          結果: /api/cabinets/years → 404（正しくは /s-automation/api/cabinets/years）

        fix_required:
          file: "frontend/src/hooks/useArchive.ts"
          changes: |
            1. 独自 apiClient を削除
            2. 共通の apiClient (src/api/client.ts) または fetchApi (src/services/api.ts) を使用
            3. または API_BASE_URL を独自 apiClient に追加

            例:
            import { apiClient } from '../api/client';
            // または
            const API_BASE_URL = import.meta.env.VITE_API_BASE_URL || '/s-automation/api';
            const apiClient = {
              get: async <T>(url: string): Promise<T> => {
                const response = await fetch(`${API_BASE_URL}${url.replace('/api', '')}`);
                ...
              },
            };

        priority: "critical（cmd_109 と同時に修正せよ）"

