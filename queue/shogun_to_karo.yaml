  # ============================================================
  # cmd_144: HRMOS経費連携 + Gドライブ連携 + OCR統合 設計
  # ============================================================
  - id: cmd_144
    timestamp: "2026-03-02T12:15:20"
    command: "HRMOS経費連携・Gドライブ連携・OCR統合の設計書を作成せよ"
    project: S-automation
    priority: medium
    status: pending
    details:
      background: |
        殿との壁打ちで以下の方向性が決定した。

        【電子化スコープ】
        - 触らない: HRMOS経費での申請（部門ユーザーの作業）
        - 電子化する: 印刷 → 判子 → ファイリング（経理部門の作業）

        【主体はPDF】
        - PDFに対して判子を押すのが本質
        - HRMOSリンクは「元の申請を確認したい時」の補助機能

      architecture: |
        ┌─────────────────────────────────────────────────────────┐
        │  Gドライブ（請求書PDF）                                  │
        └───────────────┬─────────────────────────────────────────┘
                        │
                        ▼
        ┌─────────────────────────────────────────────────────────┐
        │  既存OCR API（invoice-ocr-api / rd-vertex）             │
        │  POST /api/v1/ocr/extract                               │
        │  → 金額、支払方法、取引先名を自動抽出                   │
        └───────────────┬─────────────────────────────────────────┘
                        │
                        ▼
        ┌─────────────────────────────────────────────────────────┐
        │  S-automation                                            │
        │  - OCR結果を受け取り                                     │
        │  - ステータス管理（未確認→確認済→押印済→処理完了）      │
        │  - HRMOS伝票番号は手入力（任意）                         │
        │  - 番号入力でURLを自動生成してリンク表示                 │
        └─────────────────────────────────────────────────────────┘

      status_flow: |
        【ステータス管理】
        1. 未確認: OCR自動判定済み、経理未確認（確認ボタンのみ）
        2. 確認済: 経理が目視確認OK（判子を押せる）
        3. 押印済: 判子押下完了（取り消しのみ）
        4. 処理完了: 振込/仕訳完了（閲覧のみ）

      hrmos_link: |
        【HRMOS経費リンク】
        - HRMOS伝票番号を手入力（任意）
        - 入力例: 004600
        - 自動生成URL: https://yuidea.ekeihi.net/UI/Main/ShihaInput.aspx?pageMode=2&ino=004600&scTop=0
        - ゼロ埋め自動化（4600 → 004600）

      ocr_api_ref: |
        【既存OCR API】
        - リポジトリ: https://github.com/Yuidea-DxG/document-ai
        - エンドポイント: POST /api/v1/ocr/extract
        - 認証: Bearer {OCR_API_KEY}
        - 抽出項目: invoice_issue_date, pay_method, pay_amt_excl_tax, pay_amt_incl_tax, pay_tax_amt, supplier_name

      tasks:
        - 設計書作成（データモデル、API設計、画面設計）
        - invoice-ocr-api との連携モジュール設計
        - Gドライブ連携設計
        - ステータス管理フロー設計

