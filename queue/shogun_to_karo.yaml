    command: "R-system AI活用可能性調査・ROI提案"
    details:
      description: |
        殿より重要な調査依頼があった。顧客はAI導入によるROIを気にしている。
        業務改善の可能性を調査し、提案をまとめよ。

        【背景・状況】
        - 顧客はAI導入のROI（投資対効果）を重視
        - 超概算の話が要求整理段階に進んでしまった（フロント起因）
        - 顧客の温度感が不明（業務フロー改革OK or 既存骨格維持希望）

        【調査観点】

        ■ 既知のAI活用案（殿より提示）
        1. 画像分析（商品画像の自動分類、品質チェック等）
        2. カタログ紙面分析（レイアウト最適化、OCR高度化等）
        3. 商品分析・予測（需要予測、トレンド分析等）

        ■ 追加で検討すべきAI活用領域
        - データ入力自動化（OCR + 自然言語処理）
        - 異常検知（在庫・売上の異常パターン検出）
        - レコメンデーション（類似商品提案、関連商品紐付け）
        - 文章生成（販促文の自動生成・校正）
        - ワークフロー最適化（承認フロー自動化、ボトルネック検出）

        ■ 提案の軸（2パターン検討）

        【パターンA】既存業務フロー骨格維持
        - 現行フローはそのまま
        - AIは「既存作業の効率化・精度向上」に特化
        - 導入リスク低、ROI見積もりしやすい

        【パターンB】業務フロー改革込み
        - AIを前提とした業務フロー再設計
        - 人手作業の大幅削減・自動化
        - 導入リスク高、ROI大きい可能性

        【成果物】
        1. AI活用領域マトリクス
           - 領域 × 導入難易度 × 期待効果 × 必要データ

        2. ROI概算シナリオ（3段階）
           - ミニマム: 既存フロー維持、低リスク施策のみ
           - ミドル: 一部フロー改善、中リスク施策含む
           - マキシマム: フロー改革、高リスク高リターン

        3. 顧客温度感確認ポイント
           - 提案前に確認すべき質問リスト
           - 温度感に応じた提案の出し分け方針

        4. 参考事例（あれば）
           - 類似業界のAI導入事例
           - 期待できる改善率の目安

        【参照資料】
        - output/basic_design/（現行システム仕様）
        - output/essential_functions.md（必須機能）
        - R-System資料（業務フロー理解のため）

        【担当】
        - 軍師に調査・分析を指示
        - 別働隊を活用してリサーチ
        - 結果はdashboard.mdの「🚨 要対応」セクションに記載
          （殿が顧客と話す際の材料として使うため）

        【注意】
        - 技術的な実現可能性だけでなく、ROI観点を重視せよ
        - 顧客の温度感が不明なので、両パターン用意しておくこと
        - 「これを聞けば温度感がわかる」質問リストも作成せよ
