    details:
      description: |
        殿より重要な調査依頼があった。軍師と別働隊で調査・提案を作成せよ。

        【背景・新情報】
        - 顧客はBIツールとして「Domo」を導入済み
        - しかし各部門担当者ごとに見ているところが違う
        - Domoでデータ統合・可視化はできているが、
          DWHにありがちな「非公式DWH」が乱立していると仮定

        【調査・提案の観点】

        ■ 現状分析（既存資料ベース）
        1. 現行システム間のデータフロー確認
           - MIRROR → ARMS → RING/AS/WMS/DWH の流れ
           - 各システムからDWHへの連携内容
        2. データの重複・分散状況の推測
           - 部門別に独自集計している可能性
           - Excel等での非公式レポート作成

        ■ 顧客が自覚していない課題（仮説）
        1. 部門間でのデータ定義の不一致
           - 同じ「売上」でも集計ロジックが違う
        2. 非公式DWHの保守コスト
           - 担当者退職時のブラックボックス化
        3. データ鮮度のばらつき
           - 公式DWHは日次更新、非公式は週次など
        4. セキュリティ・ガバナンス問題
           - 個人PC上のExcelに顧客データ

        ■ 解決提案の方向性
        1. データカタログ導入（Single Source of Truth）
        2. セルフサービスBI強化（Domo活用深化）
        3. データガバナンス体制構築
        4. 段階的な非公式DWH統合ロードマップ
        5. AI活用によるデータ品質監視

        【成果物】
        - output/data_governance_proposal/ に以下を作成
          1. current_data_flow_analysis.md（現状分析）
          2. hidden_issues.md（潜在課題の仮説）
          3. solution_proposal.md（解決提案）
          4. integration_roadmap.md（統合ロードマップ）

        【参照資料】
        - output/current_system_overview.md
        - output/basic_design/data_structure.md
        - output/basic_design/interface_spec.md
        - output/ai_proposal/（AI活用との連携観点）

