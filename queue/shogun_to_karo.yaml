  - id: cmd_040
    timestamp: "2026-02-13T20:20:00"
    command: "【スキル作成】skill-evaluate 自動評価・依頼スキル"
    project: multi-agent-shogun
    priority: high
    status: done
    completed_at: "2026-02-13T20:40:00"
    details:
      summary: |
        1on1での議論を受け、殿より根本解決策の指示あり。
        「チェックリストを増やすのではなく、仕組みで解決する」

      background: |
        【問題】
        軍師がスキル評価後、作成指示を出し忘れる問題が繰り返し発生。
        - cmd_035: セキュリティスキル4件、評価後作成指示なし
        - cmd_037: gcp-iap-auth-audit (15点)、評価後作成指示なし

        【根本原因】
        評価→報告→確認→作成指示→作成 とステップが多く、途中で切れる。
        人の注意力に依存している。

      solution: |
        【殿の指示】
        「評価が14点以上なら作成するところを自動化」
        「軍師が1コマンド実行するだけで全部フローとして動く」

        【設計】
        /skill-evaluate スキルを作成。軍師がこれを実行すると：
        1. スキル候補を評価（スコアリング）
        2. 14点以上なら自動で queue/tasks/ashigaru{N}.yaml に作成タスクを書く
        3. 該当足軽に notify.sh で通知
        4. 軍師には「✅ 15点 - 自動承認。足軽Nに作成依頼済み」とメッセージ

        【効果】
        - 軍師は1コマンドで評価→依頼まで完結
        - 「報告して終わり」という切れ目がなくなる
        - 人の注意力ではなく仕組みで担保

      action_required:
        - "軍師にこの方針を伝えよ"
