  # ============================================================
  - id: cmd_120
    timestamp: "2026-02-27T12:42:15"
    command: "【緊急】SlipRow.tsx <tr>ネスティングエラー修正"
    project: S-automation
    priority: critical
    status: pending
    details:
      summary: |
        伝票一覧画面でHTMLネスティングエラーが発生。
        <tr> の中に <tr> がネストされており、React hydration エラーの原因。

      error_message: |
        SlipRow.tsx:43 In HTML, <tr> cannot be a child of <tr>.
        This will cause a hydration error.

      root_cause: |
        SlipTable.tsx:199 で Box component="tr" を使用し、
        その中で SlipRow が TableRow（<tr>）をレンダリングしている。
        結果として <tr><tr>...</tr></tr> という不正なHTML構造になっている。

      affected_files:
        - "frontend/src/components/slips/SlipRow.tsx:43"
        - "frontend/src/components/slips/SlipTable.tsx:193, 199"

      fix_approach: |
        SlipTable.tsx:199 の Box component="tr" を削除し、
        SlipRow が直接 TableBody の子になるよう修正する。
        または SlipRow 内の TableRow を Fragment に変更。

      completion_criteria:
        - "コンソールエラー解消"
        - "伝票一覧が正常に表示される"
        - "FEビルド成功"

      action_required:
        - "本隊または別働隊から1名割当"
        - "軍師にも共有（FEパターンとして知見共有）"

