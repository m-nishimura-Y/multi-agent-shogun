# === スキル評価基準（コンパクション対策） ===
skill_criteria_summary: |
  【却下基準】
  R001: 外部API認証必須 → 却下
  R002: 特定ベンダー固定 → 要注意
  R003: スコア14点未満 → 却下（12-13点は条件付き）
  R004: 既存スキルと大幅重複 → 統合検討
  R005: 機密情報の取り扱い → 却下

  【スコアリング】20点満点
  - reusability（再利用性）: 5点
  - complexity（適度な複雑性）: 5点
  - stability（安定性）: 5点
  - value（価値）: 5点
  → 14点以上: 自動承認
  → 12-13点: 条件付き承認（軍師裁量でOK）
  → 11点以下: 却下

# === メモ ===
notes: |
